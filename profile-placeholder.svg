<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 780" role="img" aria-labelledby="title desc">
  <title id="title">Mabior Kuer profile placeholder</title>
  <desc id="desc">A refined monogram placeholder that can be replaced with a professional headshot.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#174d75"/>
      <stop offset="1" stop-color="#071727"/>
    </linearGradient>
    <radialGradient id="glow" cx="25%" cy="20%" r="75%">
      <stop offset="0" stop-color="#2f86c4" stop-opacity=".5"/>
      <stop offset="1" stop-color="#2f86c4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="780" fill="url(#bg)"/>
  <rect width="640" height="780" fill="url(#glow)"/>
  <circle cx="105" cy="110" r="190" fill="none" stroke="#fff" stroke-opacity=".10" stroke-width="2"/>
  <circle cx="550" cy="610" r="240" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="2"/>
  <path d="M100 610h440" stroke="#d4a24c" stroke-opacity=".7" stroke-width="3"/>
  <text x="320" y="390" text-anchor="middle" fill="#fff" font-family="Georgia, serif" font-size="180" font-weight="700" letter-spacing="-12">MK</text>
  <text x="320" y="455" text-anchor="middle" fill="#b9d7e9" font-family="Arial, sans-serif" font-size="24" letter-spacing="8">AVIATION RESEARCH</text>
</svg>
